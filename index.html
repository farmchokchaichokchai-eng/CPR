<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>แบบทดสอบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f6;--card:#fff;--ink:#16252b;--mute:#566a72;--line:#d3dde0;--red:#c62828;--rbg:#fde4e2;--g:#12714a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191d;--card:#18262b;--ink:#e9f1f3;--mute:#9db3ba;--line:#2d4249;--red:#ef5350;--rbg:#41201d;--g:#4cc88a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10191d;--card:#18262b;--ink:#e9f1f3;--mute:#9db3ba;--line:#2d4249;--red:#ef5350;--rbg:#41201d;--g:#4cc88a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "Sarabun",system-ui,sans-serif}
header,main{max-width:720px;margin:0 auto;padding:0 18px}
header{padding-top:28px;display:flex;gap:16px;align-items:center}
.cross{flex:none;width:56px;height:56px;border-radius:8px;background:var(--red);position:relative}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;border-radius:2px}
.cross::before{left:23px;top:11px;width:10px;height:34px}.cross::after{left:11px;top:23px;width:34px;height:10px}
h1{font-size:clamp(23px,6vw,34px);line-height:1.25;font-weight:800;margin:0}
.sub{color:var(--mute);margin:2px 0 0;font-size:15px}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:14px 16px;margin:20px 0 0}
legend{font-weight:600;padding:0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row label{flex:1 1 220px;font-size:15px;color:var(--mute)}
input[type=text]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.mode{display:flex;gap:10px;margin-top:10px}
.mode label{flex:1;text-align:center;padding:8px;border:2px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600}
.mode input{position:absolute;opacity:0}
.mode label:has(input:checked){border-color:var(--red);background:var(--rbg)}
.mode label:has(input:focus-visible){outline:3px solid var(--ink)}
.q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px;padding:16px 16px 10px;margin:16px 0}
.q.miss{border-left-color:var(--red)}
.q h2{font-size:18px;font-weight:600;margin:0 0 8px;line-height:1.5}
.o{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.o:hover{border-color:var(--red)}.o input{margin-top:7px;accent-color:var(--red)}
.o:focus-within{outline:3px solid var(--ink);outline-offset:1px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:600 17px "Sarabun",sans-serif;padding:10px 22px;border:0;background:var(--red);color:#fff;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dq{padding:10px 0;border-top:1px dashed var(--line)}.ok{color:var(--g);font-weight:600}.bad{color:var(--red);font-weight:600}#rv h2{font-size:22px;margin:18px 0 4px}
#done{display:none;background:var(--card);border:2px solid var(--red);border-radius:6px;padding:18px;margin:20px 0}
#done h2{margin:0 0 6px}#err{color:var(--red);font-weight:600}#ld{margin:24px 0;color:var(--mute)}
</style></head><body>
<header><div class="cross" aria-hidden="true"></div><div><h1 id="h">แบบทดสอบ</h1><p class="sub" id="sb"></p></div></header>
<main>
<p id="ld" role="status">กำลังโหลดข้อสอบ...</p>
<div id="form" style="display:none">
<fieldset><legend>ข้อมูลผู้ทำแบบทดสอบ</legend>
<div class="row"><label>ชื่อ - สกุล (จำเป็น)<input type="text" id="nm" autocomplete="name"></label><label>ฝ่าย/แผนก/สังกัด<input type="text" id="dp"></label></div>
<div class="mode" role="radiogroup" aria-label="ประเภทแบบทดสอบ"><label><input type="radio" name="mode" value="ก่อนอบรม" checked>ก่อนอบรม</label><label><input type="radio" name="mode" value="หลังอบรม">หลังอบรม</label></div>
</fieldset>
<p class="sub" style="margin-top:16px">เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว เมื่อเสร็จแล้วกด “ส่งคำตอบ”</p>
<div id="list"></div>
<div class="bar"><button id="go">ส่งคำตอบ</button><span id="err" role="alert"></span></div>
</div>
<div id="done" role="status"><h2>ส่งคำตอบเรียบร้อยแล้ว</h2><p id="dm">ผู้ดูแลจะตรวจและแจ้งคะแนนให้ทราบ</p><div id="rv"></div></div>
</main>
<script>
var DB="https://cpr-farm-default-rtdb.firebaseio.com",LET="กขคงจฉ",L=document.getElementById("list"),EX=null,CF={},ord=[],rec=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(m,p,b){var o={method:m};if(b!==undefined)o.body=JSON.stringify(b);return fetch(DB+p+".json",o).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function ld(t){document.getElementById("ld").textContent=t}
api("GET","/exams/current").then(function(x){if(!x||!x.items){ld("ยังไม่มีข้อสอบที่เผยแพร่ กรุณาติดต่อผู้ดูแล");return}init(x)}).catch(function(){ld("โหลดข้อสอบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้")});
function init(x){
 EX=x;CF=x.cfg||{};
 ord=EX.items.map(function(_,i){return i});
 if(CF.n&&CF.n<ord.length){ord=shuf(ord).slice(0,CF.n);if(!CF.sq)ord.sort(function(a,b){return a-b})}
 if(CF.sq)shuf(ord);
 document.title=EX.title;document.getElementById("h").textContent=EX.title;
 document.getElementById("sb").textContent=(EX.sub?EX.sub+" · ":"")+ord.length+" ข้อ";
 ord.forEach(function(i,p){
  var d=EX.items[i],q=document.createElement("section");q.className="q";q.id="q"+i;
  var os=d.o.map(function(_,j){return j});if(CF.so)shuf(os);
  var h="<h2>"+(p+1)+". "+esc(d.q)+"</h2>";
  os.forEach(function(j,k){h+='<label class="o"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+LET.charAt(k)+". "+esc(d.o[j])+"</span></label>"});
  q.innerHTML=h;L.appendChild(q);
 });
 document.getElementById("ld").style.display="none";document.getElementById("form").style.display="block";
}
document.getElementById("go").onclick=function(){
 var nm=document.getElementById("nm").value.trim(),err=document.getElementById("err"),b=this;
 if(!nm){err.textContent="กรุณากรอกชื่อ - สกุล";document.getElementById("nm").focus();return}
 var a=EX.items.map(function(){return -2}),miss=[],first=null;
 ord.forEach(function(i,p){var c=document.querySelector("input[name=q"+i+"]:checked");a[i]=c?+c.value:-1;document.getElementById("q"+i).classList.toggle("miss",!c);if(!c){miss.push(p+1);if(first==null)first=i}});
 if(miss.length){err.textContent="ยังไม่ได้ตอบข้อ "+miss.join(", ");document.getElementById("q"+first).scrollIntoView({behavior:"smooth",block:"center"});return}
 rec={id:rec?rec.id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),eid:EX.id,n:nm,d:document.getElementById("dp").value.trim(),m:document.querySelector("input[name=mode]:checked").value,a:a,t:new Date().toISOString()};
 b.disabled=true;err.textContent="กำลังส่ง...";
 api("PUT","/results/"+rec.id,rec).then(finish).catch(function(){b.disabled=false;err.textContent="ส่งไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วกด “ส่งคำตอบ” อีกครั้ง"});
};
function finish(){
 document.getElementById("form").style.display="none";document.getElementById("done").style.display="block";window.scrollTo(0,0);
 if(rec.m==="หลังอบรม"&&CF.rk!==false){
  document.getElementById("dm").textContent="กำลังโหลดเฉลย...";
  api("GET","/archive/"+EX.id).then(review).catch(function(){document.getElementById("dm").textContent="โหลดเฉลยไม่สำเร็จ ผู้ดูแลจะแจ้งคะแนนให้ทราบ"});
 }
}
function review(F){
 var s=0,h="";
 ord.forEach(function(i,p){var d=EX.items[i],k=F.items[i],a=rec.a[i],ok=a===k.a;if(ok)s++;
  h+='<div class="dq"><b>'+(p+1)+". "+esc(d.q)+"</b><br>คำตอบของคุณ: "+(a<0?"ไม่ได้ตอบ":esc(d.o[a]))+' <span class="'+(ok?"ok":"bad")+'">'+(ok?"✓ ถูก":"✗ ผิด")+"</span>"+(ok?"":"<br>เฉลย: "+esc(d.o[k.a]))+(k.e?'<br><span class="sub">'+esc(k.e)+"</span>":"")+"</div>"});
 document.getElementById("dm").textContent="ผู้ดูแลจะตรวจและบันทึกคะแนนของคุณเช่นกัน";
 document.getElementById("rv").innerHTML='<h2>คะแนนของคุณ '+s+' / '+ord.length+'</h2><p class="sub">เฉลยรายข้อ</p>'+h;
}
</script></body></html>
